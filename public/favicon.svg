<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Tablero de corcho con marco de tinta, como los botones de la app -->
  <rect x="3" y="3" width="58" height="58" rx="12" fill="#c49a6c" stroke="#2a1c10" stroke-width="4"/>
  <g fill="#8a5a2c" opacity="0.55">
    <circle cx="13" cy="15" r="1.6"/><circle cx="50" cy="12" r="1.3"/><circle cx="12" cy="48" r="1.5"/>
    <circle cx="52" cy="50" r="1.7"/><circle cx="22" cy="53" r="1.2"/><circle cx="47" cy="30" r="1.2"/>
  </g>
  <!-- Hilo rojo que sale de la ficha -->
  <path d="M30 22 Q 44 46 52 20" fill="none" stroke="#c62828" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="52" cy="20" r="3.4" fill="#efe6d2" stroke="#2a1c10" stroke-width="1.8"/>
  <!-- Ficha de papel, apenas torcida -->
  <g transform="rotate(-8 28 36)">
    <rect x="15" y="20" width="26" height="31" fill="#fffaf0" stroke="#2a1c10" stroke-width="2.6"/>
    <rect x="16.3" y="21.3" width="23.4" height="8" fill="#5fd8d2"/>
    <path d="M19 37 H37 M19 43 H33" stroke="#1f4e8c" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Chinche roja -->
  <circle cx="30" cy="22" r="5.6" fill="#d32f2f" stroke="#2a1c10" stroke-width="2"/>
  <circle cx="28.2" cy="20.2" r="1.7" fill="#fff" opacity="0.7"/>
</svg>
